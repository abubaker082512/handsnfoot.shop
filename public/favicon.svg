<svg width="32" height="32" viewBox="0 0 100 100" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Gradient Definition -->
  <defs>
    <linearGradient id="logoGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#667eea" />
      <stop offset="100%" stop-color="#764ba2" />
    </linearGradient>
  </defs>
  
  <!-- Watch Circle -->
  <circle cx="50" cy="35" r="20" stroke="url(#logoGradient)" stroke-width="3" fill="none" />
  
  <!-- Watch Hands -->
  <line x1="50" y1="35" x2="50" y2="25" stroke="url(#logoGradient)" stroke-width="2" stroke-linecap="round" />
  <line x1="50" y1="35" x2="58" y2="35" stroke="url(#logoGradient)" stroke-width="2" stroke-linecap="round" />
  
  <!-- Shoe Silhouette -->
  <path
    d="M 30 70 Q 35 65 45 65 L 65 65 Q 70 65 70 70 L 68 75 Q 67 78 63 78 L 32 78 Q 28 78 28 74 Z"
    fill="url(#logoGradient)"
  />
  
  <!-- Connecting Element -->
  <line x1="50" y1="55" x2="50" y2="65" stroke="url(#logoGradient)" stroke-width="2" stroke-dasharray="2 2" />
</svg>
